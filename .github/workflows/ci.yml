name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Only the light test group: no PyTorch/YOLO download, headless OpenCV
      - name: Install test dependencies
        run: uv sync --frozen --only-group test

      - name: Lint
        run: uvx ruff@0.17.3 check .

      - name: Test
        run: uv run --no-sync pytest -q
